<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高考数学互动实验室</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b1222;color:#eef4ff;font:16px system-ui,'Microsoft YaHei',sans-serif}main{max-width:1180px;margin:auto;padding:30px 20px}header{color:#5fe2e1;font-weight:800}h1{font-size:clamp(30px,5vw,54px);margin:20px 0 8px}p{color:#b6c4d8;line-height:1.8}.hero{padding:45px 0;background:radial-gradient(ellipse at 30% 30%,#203a60,transparent 70%)}nav{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}button{border:1px solid #39516e;border-radius:10px;background:#20314d;color:white;padding:11px 15px;cursor:pointer}button.active,.primary{background:#5fe2e1;color:#0b2230;font-weight:bold}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}.card{background:#152139;border:1px solid #30435f;border-radius:18px;padding:22px;min-width:0}.formula{padding:18px;background:#0c172a;border-radius:12px;line-height:2;overflow:auto}.step{margin:10px 0;border:1px solid #39516e;border-radius:10px}.step button{width:100%;text-align:left;border:0;background:transparent;font-weight:bold}.step div{display:none;padding:15px;line-height:1.9;color:#d3e0f0}.step.open div{display:block}.choice{width:100%;text-align:left;margin:5px 0}.good{background:#225b45}.bad{background:#65303d}canvas{max-height:340px}input{width:100%;accent-color:#5fe2e1}.note{background:#123143;border-left:3px solid #5fe2e1;padding:13px;line-height:1.7}footer{color:#9fb0c9;font-size:13px;margin:30px 0}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main><header>∑ 高考数学 · INTERACTIVE LAB</header><div class="hero"><h1>让压轴题变成<br><span style="color:#5fe2e1">可以探索的数学实验</span></h1><p>滑动参数 · 动态图像 · 逐步证明 · 随堂挑战</p></div><nav id="tabs"></nav><div class="grid"><section class="card"><h2 id="title"></h2><p id="intro"></p><div class="formula" id="formula"></div><h3>逐步解题</h3><div id="steps"></div><button class="primary" onclick="document.querySelectorAll('.step').forEach(x=>x.classList.add('open'));typeset()">展开全部步骤</button><h3>✦ 检查理解</h3><p id="question"></p><div id="choices"></div><p id="feedback"></p></section><section class="card"><h2>交互可视化</h2><p id="graphInfo"></p><div style="height:340px"><canvas id="chart"></canvas></div><p><span id="controlName"></span>：<b id="value"></b></p><input id="slider" type="range"><p class="note" id="note"></p><p style="font-size:13px">图像为数值演示；证明请参考左侧。</p></section></div><footer>原创高考风格练习题，并非官方历年高考原题。图表与公式依赖在线 CDN。将本文件上传为 index.html 即可在 GitHub Pages 使用。</footer></main><script>
const topics=[
{tab:'导数与不等式',title:'参数恒成立问题',intro:'寻找使函数始终非负的参数范围。',formula:'设 \(f(x)=e^x-1-x-ax^2\)，\(x\ge0\)。求使 \(f(x)\ge0\) 恒成立的 \(a\) 的范围。',steps:[['求必要条件','因为 \(\lim_{x\to0^+}(e^x-1-x)/x^2=1/2\)，所以必须 \(a\le1/2\)。'],['构造辅助函数','令 \(g(x)=e^x-1-x-x^2/2\)。有 \(g(0)=g\prime(0)=0\)，且 \(g\prime\prime(x)=e^x-1\ge0\)。'],['证明充分性','由 \(g\prime\prime\ge0\) 得 \(g\prime\ge0\)，故 \(g\ge0\)。当 \(a\le1/2\) 时，\(f(x)=g(x)+(1/2-a)x^2\ge0\)。'],['结论','\(\boxed{a\le1/2}\)。']],q:'最大的 a 是？',opts:['0','1/2','1'],ans:1,why:'二阶项在 x→0 时决定临界值。',label:'参数 a',min:-.5,max:1.5,step:.05,start:.5,info:'调节 a，观察 f(x) 是否跌破零线。',note:v=>v<=.5?'满足恒成立条件。':'在接近 x=0 的位置会出现负值。',lines:v=>[{label:'f(x)',data:seq(0,2,.02).map(x=>({x,y:Math.exp(x)-1-x-v*x*x}))},{label:'y=0',data:[{x:0,y:0},{x:2,y:0}],borderDash:[5,5]}]},
{tab:'圆锥曲线',title:'椭圆切线与截距',intro:'通过动点研究切线与坐标轴的交点。',formula:'椭圆 \(x^2/9+y^2/4=1\)，动点 \(P=(3\cos t,2\sin t)\)，\(0<t<\pi/2\)。求 P 处切线的两轴截距乘积最小值。',steps:[['写出切线','点 P 处切线：\(x\cos t/3+y\sin t/2=1\)。'],['计算截距','横截距 \(A=3/\cos t\)，纵截距 \(B=2/\sin t\)。'],['转化为三角函数','\(AB=6/(\sin t\cos t)=12/\sin(2t)\)。'],['最小值','\(\sin(2t)\le1\)，所以 \(\boxed{AB\ge12}\)，在 \(t=45^\circ\) 取等号。']],q:'最小截距乘积是多少？',opts:['6','12','18'],ans:1,why:'AB=12/sin(2t)。',label:'角度 t（°）',min:10,max:80,step:1,start:45,info:'观察椭圆和随角度变化的切线。',note:v=>'截距乘积 ≈ '+(12/Math.sin(v*Math.PI/90)).toFixed(2),lines:v=>{let t=v*Math.PI/180;return [{label:'椭圆',data:seq(0,360,2).map(a=>({x:3*Math.cos(a*Math.PI/180),y:2*Math.sin(a*Math.PI/180)}))},{label:'切线',data:seq(-4,6,.1).map(x=>({x,y:2*(1-x*Math.cos(t)/3)/Math.sin(t)}))},{label:'动点',data:[{x:3*Math.cos(t),y:2*Math.sin(t)}],pointRadius:7,showLine:false}]}},
{tab:'数列与极限',title:'递推数列的收敛',intro:'为什么单调有界能保证极限存在？',formula:'\(a_1=1,\quad a_{n+1}=\sqrt{2+a_n}\)。证明数列递增且小于 2，并求极限。',steps:[['归纳证明有界','初值为 1。若 \(1\le a_n<2\)，则 \(1<\sqrt{2+a_n}<2\)。'],['证明递增','\(a_{n+1}>a_n\) 等价于 \((2-a_n)(a_n+1)>0\)，成立。'],['证明收敛','数列单调递增且有上界 2，故极限存在。'],['求极限','设极限 L，则 \(L=\sqrt{2+L}\)，即 \((L-2)(L+1)=0\)。因为 \(L\ge1\)，所以 \(\boxed{L=2}\)。']],q:'数列极限是？',opts:['1','2','3'],ans:1,why:'求出不动点并利用 L≥1 排除 -1。',label:'显示项数 N',min:2,max:20,step:1,start:10,info:'逐步显示数列项如何逼近 2。',note:v=>'显示前 '+v+' 项；数列从下方逼近 2。',lines:v=>{let a=1,p=[];for(let n=1;n<=v;n++){p.push({x:n,y:a});a=Math.sqrt(2+a)}return [{label:'aₙ',data:p},{label:'极限 2',data:[{x:1,y:2},{x:v,y:2}],borderDash:[5,5]}]}},
{tab:'概率与统计',title:'二项分布的形状',intro:'成功概率改变时，概率分布如何移动？',formula:'独立重复进行 10 次试验，每次成功概率为 \(p\)。设 X 为成功次数，求 \(P(X=k)\)、\(E[X]\) 和 \(\mathrm{Var}(X)\)。',steps:[['确定模型','\(X\sim B(10,p)\)，因为是 10 次独立同分布伯努利试验。'],['计算概率','\(P(X=k)=\binom{10}{k}p^k(1-p)^{10-k}\)。'],['计算期望','用指示变量之和：\(\boxed{E[X]=10p}\)。'],['计算方差','利用独立性：\(\boxed{\mathrm{Var}(X)=10p(1-p)}\)。']],q:'p=0.5 时 E[X] 是？',opts:['2.5','5','10'],ans:1,why:'期望 np=10×0.5=5。',label:'成功概率 p',min:.05,max:.95,step:.05,start:.5,info:'拖动 p，观察各成功次数的概率变化。',note:v=>'期望 = '+(10*v).toFixed(2)+'；方差 = '+(10*v*(1-v)).toFixed(2),lines:v=>{let c=[1,10,45,120,210,252,210,120,45,10,1];return [{label:'P(X=k)',data:c.map((z,k)=>({x:k,y:z*v**k*(1-v)**(10-k)}))}]}}
];
let active=0,chart;const $=id=>document.getElementById(id);function seq(a,b,s){let z=[];for(let x=a;x<=b+1e-8;x+=s)z.push(x);return z}function typeset(){if(window.MathJax?.typesetPromise)MathJax.typesetPromise().catch(()=>{})}function load(i){active=i;let t=topics[i];$('tabs').innerHTML=topics.map((x,j)=>`<button class="${i===j?'active':''}" onclick="load(${j})">${x.tab}</button>`).join('');for(let [k,v] of [['title',t.title],['intro',t.intro],['formula',t.formula],['question',t.q],['graphInfo',t.info],['controlName',t.label]])$(k).textContent=v;$('steps').innerHTML=t.steps.map(([h,b],j)=>`<div class="step"><button onclick="this.parentElement.classList.toggle('open');typeset()">第 ${j+1} 步 · ${h} ＋</button><div>${b}</div></div>`).join('');$('choices').innerHTML=t.opts.map((x,j)=>`<button class="choice" onclick="check(${j})">${String.fromCharCode(65+j)}. ${x}</button>`).join('');$('feedback').textContent='';let s=$('slider');s.min=t.min;s.max=t.max;s.step=t.step;s.value=t.start;s.oninput=draw;draw();typeset()}function check(j){let t=topics[active];document.querySelectorAll('.choice').forEach((b,k)=>{b.classList.toggle('good',k===t.ans);b.classList.toggle('bad',k===j&&j!==t.ans)});$('feedback').textContent=(j===t.ans?'✓ 正确！ ':'再试一次。 ')+t.why}function draw(){let t=topics[active],v=+$('slider').value;$('value').textContent=v;$('note').textContent=t.note(v);let ds=t.lines(v).map((d,i)=>({...d,fill:false,parsing:false,borderColor:d.borderColor||['#5fe2e1','#f7b878','#ae9bff'][i],backgroundColor:d.borderColor||['#5fe2e1','#f7b878','#ae9bff'][i],borderWidth:2,pointRadius:d.pointRadius??(active===2?3:0),tension:.05}));if(chart)chart.destroy();chart=new Chart($('chart'),{type:active===3?'bar':'line',data:{datasets:ds},options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{labels:{color:'#cbd8ea'}}},scales:{x:{type:'linear',ticks:{color:'#a4b4c8'},grid:{color:'#2a3b52'}},y:{ticks:{color:'#a4b4c8'},grid:{color:'#2a3b52'}}}}})}load(0);
</script></body></html>
